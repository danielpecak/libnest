name: documentation

on: [push, pull_request, workflow_dispatch]

permissions:
  contents: write

jobs:
  docs:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install libnest with the docs toolchain
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[docs]"
      - name: Sphinx build (warnings are errors, all cross-references must resolve)
        run: make -C docs html SPHINXOPTS="-W --keep-going -n"
      - name: Deploy to GitHub Pages
        uses: peaceiris/actions-gh-pages@v3
        if: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}
        with:
          publish_branch: sphinx
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: docs/_build/html/
          force_orphan: true
      - name: Check external links (informational, does not fail the job)
        continue-on-error: true
        run: make -C docs linkcheck
